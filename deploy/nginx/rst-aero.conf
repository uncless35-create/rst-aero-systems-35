# nginx перед сайтом: HTTPS, редиректы на https://rst-aero.ru, проксирование в Next.js (127.0.0.1:3000).
# Сертификат Let's Encrypt продлевает certbot (certbot.timer), после продления nginx перезагружается.

upstream rst_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rst-aero.ru www.rst-aero.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://rst-aero.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rst-aero.ru;

    ssl_certificate     /etc/nginx/ssl/rst-aero/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rst-aero/privkey.pem;

    return 301 https://rst-aero.ru$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name rst-aero.ru;

    ssl_certificate     /etc/nginx/ssl/rst-aero/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rst-aero/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Фото из админки
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml image/svg+xml text/x-component;

    access_log /var/log/nginx/rst-aero.access.log;
    error_log  /var/log/nginx/rst-aero.error.log warn;

    # Пока сайт перезапускается (выкладка, обслуживание) — короткая страница вместо голой 502.
    # Код 503 — поисковики понимают, что это временно, и не выкидывают страницы из индекса.
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/rst-maintenance;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    location / {
        proxy_pass http://rst_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
